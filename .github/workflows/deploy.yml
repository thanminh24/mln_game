name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # allows manual trigger from GitHub Actions tab

env:
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      sha: ${{ steps.meta.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # Game: Express + Socket.IO + built React client
      - name: Build & push mln-game
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/mln-game:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/mln-game:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=mln-game
          cache-to: type=gha,scope=mln-game,mode=max

      # Landing page: static site via nginx:alpine (mln111g5.skinsunny.info.vn)
      - name: Build & push mln-landing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.landing
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/mln-landing:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/mln-landing:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=mln-landing
          cache-to: type=gha,scope=mln-landing,mode=max

  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    needs: build
    if: success()

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            set -e
            mkdir -p /home/deploy/mln-game
            cat > /home/deploy/mln-game/docker-compose.prod.yml << 'COMPOSE'
            services:
              mln-game:
                image: ghcr.io/${{ secrets.GHCR_OWNER }}/mln-game:latest
                ports:
                  - "6942:6942"
                environment:
                  NODE_ENV: production
                  PORT: "6942"
                  APP_BASE_PATH: "/"
                restart: unless-stopped
              mln-landing:
                image: ghcr.io/${{ secrets.GHCR_OWNER }}/mln-landing:latest
                ports:
                  - "6943:80"
                restart: unless-stopped
            COMPOSE
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_OWNER }}" --password-stdin
            cd /home/deploy/mln-game
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            for img in mln-game mln-landing; do
              docker images "ghcr.io/${{ secrets.GHCR_OWNER }}/${img}" --format "{{.ID}} {{.Tag}}" | sort -k2 -r | awk 'NR>2 {print $1}' | xargs -r docker rmi || true
            done
            echo "Deploy complete — SHA ${{ needs.build.outputs.sha }}"
